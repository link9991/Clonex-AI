<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clonex</title>
<style>
:root{--bg:#121212;--card:#1f1f1e;--card2:#262625;--tx:#f2f1ee;--mut:#9b9a96;--line:#2e2e2c;--acc:#d97757;--pur:#a99bf5;--blue:#2f7df6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;justify-content:space-between;padding:18px 20px;color:var(--tx)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:0 18px}
.hero{margin:auto;text-align:center;padding-bottom:60px}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:28px;margin-top:18px}
.msg{margin:10px 0;max-width:85%;line-height:1.45;font-size:15px}
.msg.u{align-self:flex-end;background:var(--card2);padding:10px 14px;border-radius:18px}
.msg.a{font-family:Georgia,serif;white-space:pre-wrap}
.inp{margin:0 10px 10px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px}
.promo{display:flex;justify-content:space-between;background:var(--card2);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--mut)}
.promo b{color:var(--pur);font-weight:500}
textarea{width:100%;background:none;border:0;outline:0;color:var(--tx);font:16px system-ui;resize:none;padding:14px 8px 10px;height:50px}
textarea::placeholder{color:#6f6e6a}
.row{display:flex;align-items:center;gap:8px}
.circ{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.pill{background:var(--card2);border-radius:20px;padding:10px 16px;font-size:14px}
.pill span{color:var(--mut)}
.sp{flex:1}
.send{background:#fff;color:#000}
.send.on{background:var(--acc);color:#fff}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:5}
